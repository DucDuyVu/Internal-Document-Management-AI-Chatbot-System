server.port=8080

# ===== MySQL (cu - da comment) =====
#spring.datasource.url = jdbc:mysql://localhost:3306/javaweb1
#spring.datasource.username = root
#spring.datasource.password = 123456

# ===== PostgreSQL (dang dung) =====
spring.datasource.url=jdbc:postgresql://localhost:5432/idms
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# jwt - secret key, thoi gian het token, thoi gian refresh token
jwt.secret=12345678901234567890123456789012
jwt.access-token-expired=30m
jwt.refresh-token-expired=1d
jwt.reset-password-token-expired=15m

# Hibernate KHONG tu dong sua schema nua (tranh lap lai loi mat cot status)
spring.jpa.hibernate.ddl-auto=none
#spring.jpa.hibernate.ddl-auto=validate
#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl-auto=create
#spring.jpa.hibernate.ddl-auto=create-drop

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.profiles.active=local

gemini.api.key=
gemini.api.embedding-url=https://generativelanguage.googleapis.com/v1beta/models/gemini-embedding-001:embedContent

# ===== RAG Query Pipeline (Tuan 3) =====
rag.search.top-k=5
rag.search.threshold=0.65

# ===== RAG Query Pipeline - Milestone 2 (Chat) =====
gemini.api.chat-url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent
rag.prompt.chunk-max-length=300