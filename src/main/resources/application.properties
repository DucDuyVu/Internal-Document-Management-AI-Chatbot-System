server.port=8080

# ===== MySQL (cu - da comment) =====
#spring.datasource.url = jdbc:mysql://localhost:3306/javaweb1
#spring.datasource.username = root
#spring.datasource.password = 123456

# ===== PostgreSQL (dang dung) =====
spring.datasource.url=jdbc:postgresql://localhost:5432/idms
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

#spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.ddl-auto=validate 
#sửa lỗi mất cột status trong bảng user_role khi chạy lại project

#spring.jpa.hibernate.ddl-auto=create
#spring.jpa.hibernate.ddl-auto=create-drop

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.profiles.active=local

gemini.api.key=
gemini.api.embedding-url=https://generativelanguage.googleapis.com/v1beta/models/gemini-embedding-001:embedContent

# ===== RAG Query Pipeline (Tuan 3) =====
rag.search.top-k=5
rag.search.threshold=0.65

# ===== RAG Query Pipeline - Milestone 2 (Chat) =====
#gemini.api.chat-url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent
gemini.api.chat-url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent
rag.prompt.chunk-max-length=300