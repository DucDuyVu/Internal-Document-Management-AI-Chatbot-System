<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title layout:title-pattern="$layout_title - $content_title">Quản trị – IDMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="icon" type="image/png" href="/images/favicon.png">
  
  <!-- CSS riêng của từng trang -->
  <th:block layout:fragment="custom-css"></th:block>
</head>

<body>

<div class="layout">

  <!-- ==================== SIDEBAR ==================== -->
  <aside class="sidebar" id="sidebar">
    <a href="/" class="sidebar-logo">
      <div class="sidebar-logo-icon">📁</div>
      <span class="sidebar-logo-name">IDMS <em>AI</em></span>
    </a>


    <p class="nav-section-label">Quản trị hệ thống</p>
    <ul class="sidebar-nav" id="sidebarNav">
      <li class="active" data-tab="tabOverview">
        <span class="nav-icon">📊</span>
        <span>Tổng quan</span>
      </li>
      <li data-tab="tabUsers">
        <span class="nav-icon">👥</span>
        <span>Người dùng</span>
      </li>
      <li data-tab="tabDepartments">
        <span class="nav-icon">🏢</span>
        <span>Phòng ban</span>
      </li>
      <li data-tab="tabDocuments">
        <span class="nav-icon">📁</span>
        <span>Tài liệu</span>
      </li>
      <li data-tab="tabPermissions">
        <span class="nav-icon">🔐</span>
        <span>Phân quyền</span>
      </li>
      <li data-tab="tabUpload">
        <span class="nav-icon">📤</span>
        <span>Upload PDF</span>
      </li>
      <li data-tab="tabChat">
        <span class="nav-icon">💬</span>
        <span>AI Chat Log</span>
      </li>
      <li data-tab="tabLogs">
        <span class="nav-icon">📋</span>
        <span>Audit Log</span>
      </li>
    </ul>

    <div class="sidebar-divider"></div>

    <p class="nav-section-label">Tài khoản</p>
    <ul class="sidebar-nav">
      <li data-tab="tabProfile">
        <span class="nav-icon">👤</span>
        <span>Hồ sơ cá nhân</span>
      </li>
    </ul>

  </aside>

  <!-- Overlay for mobile -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <!-- ==================== MAIN ==================== -->
  <main class="main">

    <!-- Topbar -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
        <span class="page-title" id="pageTitle" layout:fragment="page-title">📊 Tổng quan hệ thống</span>
      </div>
      <div class="topbar-right">
        <span class="role-badge admin" id="topRoleBadge">Quản trị viên</span>
        <div class="user-pill" onclick="switchTab('tabProfile', null); if(typeof loadTabData === 'function') loadTabData('tabProfile');" style="cursor:pointer;">
          <div class="user-avatar" id="userAvatar">A</div>
          <span class="user-name" id="fullName">Đang tải...</span>
        </div>
        <button class="btn-logout" id="logoutBtnTop">🚪 Đăng xuất</button>
      </div>
    </header>

    <!-- ========== PAGE BODY ========== -->
    <div class="page-body" layout:fragment="content">
      <!-- Nội dung chính của trang sẽ được chèn vào đây -->
    </div>

  </main>
</div>



<!-- MODAL Xác nhận -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal" style="max-width:360px;">
    <div class="modal-header">
      <h3 id="confirmTitle">Xác nhận</h3>
      <button class="modal-close" onclick="closeModal('confirmModal')">✕</button>
    </div>
    <p id="confirmMsg" style="font-size:0.875rem;color:#6b7280;line-height:1.6;"></p>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('confirmModal')">Hủy</button>
      <button id="confirmActionBtn" class="btn-danger-sm" onclick="executeConfirm()">Xác nhận</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast">
  <span id="toastIcon">✅</span>
  <span id="toastMsg">Thao tác thành công!</span>
</div>

<script src="/js/common.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/admin/dashboard.js"></script>

<!-- JS riêng của từng trang -->
<th:block layout:fragment="custom-js"></th:block>

<!-- Kiểm tra nếu chưa login thì redirect -->
<script>
  (function() {
      try {
          const token = localStorage.getItem('accessToken');
          if (!token) {
              window.location.href = '/login';
              return;
          }
          const userStr = localStorage.getItem('user');
          if (!userStr) {
              window.location.href = '/login';
              return;
          }
          const user = JSON.parse(userStr);
          if (user.role !== 'ADMIN') {
              window.location.href = '/user/dashboard';
              return;
          }
      } catch (e) {
          window.location.href = '/login';
      }
  })();
</script>
</body>
</html>
