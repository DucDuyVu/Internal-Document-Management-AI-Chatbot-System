<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Đăng nhập vào IDMS – Hệ thống quản lý tài liệu nội bộ và AI Chatbot.">
  <title>Đăng nhập – IDMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- ✅ Sửa đường dẫn CSS -->
  <link rel="stylesheet" th:href="@{/css/login.css}" href="/css/login.css">

  <!-- ✅ Thêm favicon -->
  <link rel="icon" type="image/png" th:href="@{/images/favicon.png}" href="/images/favicon.png">
</head>
<body>

<div class="card">

  <!-- Logo -->
  <div class="mark">
    <div class="mark-icon">📁</div>
    <span class="mark-text">IDMS <em>AI</em></span>
  </div>

  <!-- Heading -->
  <div class="head">
    <span class="eyebrow">Chào mừng trở lại</span>
    <h1>Đăng nhập</h1>
    <p>Nhập thông tin tài khoản để tiếp tục sử dụng hệ thống.</p>
  </div>

  <!-- Error -->
  <div class="error-msg" id="errorMsg">
    <span>⚠</span>
    <span id="errorText">Email hoặc mật khẩu không đúng.</span>
  </div>

  <!-- Form -->
  <form id="loginForm" novalidate>

    <div class="field">
      <label for="email">Email</label>
      <div class="field-wrap">
        <input type="email" id="email" class="no-icon" placeholder="vd: nguyen@congty.vn" required>
      </div>
    </div>

    <div class="field">
      <label for="password">Mật khẩu</label>
      <div class="field-wrap">
        <input type="password" id="password" placeholder="Nhập mật khẩu của bạn" required>
        <button type="button" class="toggle-pass" id="togglePass">Hiện</button>
      </div>
    </div>

    <div class="row-between">
      <label class="remember">
        <input type="checkbox" id="rememberMe">
        Ghi nhớ đăng nhập
      </label>
      <a th:href="@{/forgot-password}" href="/forgot-password">Quên mật khẩu?</a>
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">
      <span class="spinner"></span>
      <span class="btn-label">Đăng nhập</span>
    </button>

  </form>

  <div class="divider">hoặc</div>

  <p class="signup-line">
    Chưa có tài khoản?
    <a th:href="@{/register}" href="/register">Đăng ký ngay</a>
  </p>

</div>

<!-- ============================================ -->
<!-- ✅ QUAN TRỌNG: Load scripts theo đúng thứ tự -->
<!-- ============================================ -->
<script th:src="@{/js/common.js}" src="/js/common.js"></script>
<script th:src="@{/js/auth.js}" src="/js/auth.js"></script>
<script th:src="@{/js/login.js}" src="/js/login.js"></script>

<!-- ✅ Kiểm tra đã đăng nhập chưa -->
<script>
  (function() {
    try {
      const token = localStorage.getItem('accessToken');
      if (token) {
        const userStr = localStorage.getItem('user');
        if (userStr) {
          const user = JSON.parse(userStr);
          // Nếu đã đăng nhập, chuyển đến dashboard tương ứng
          if (user.role === 'ADMIN') {
            window.location.href = '/admin/dashboard';
          } else {
            window.location.href = '/user/dashboard';
          }
        }
      }
    } catch (e) {
      // Bỏ qua lỗi
    }
  })();
</script>

</body>
</html>
