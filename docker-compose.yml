version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: idms-postgres
    environment:
      POSTGRES_DB: idms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    restart: unless-stopped

volumes:
  postgres-data:
